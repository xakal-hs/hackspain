name: Deploy frontend to Vercel

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'frontend/**'
      - '.github/workflows/vercel-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/vercel-deploy.yml'

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    outputs:
      vercel-ready: ${{ steps.secrets.outputs.ready }}
    defaults:
      run:
        working-directory: frontend
    steps:
      # El contexto `env` no existe en el `if:` de un job, así que la comprobación se hace
      # aquí y viaja como salida. Mirarlo desde el `if` dejaba el workflow sin arrancar.
      - name: Check whether Vercel is connected
        id: secrets
        working-directory: .
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Vercel no está conectado todavía: se verifica pero no se despliega.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build Nuxt and Nitro
        run: pnpm build

  deploy:
    # Secrets do not reach forked pull requests. They also must all exist before
    # attempting a deploy, so CI remains useful before Vercel is connected.
    needs: verify
    if: >-
      needs.verify.outputs.vercel-ready == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Pull the matching Vercel environment
        run: pnpm dlx vercel@50.15.1 pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build prebuilt output
        run: pnpm dlx vercel@50.15.1 build ${{ github.event_name == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url="$(pnpm dlx vercel@50.15.1 deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish deployment link
        run: echo "### Vercel $VERCEL_ENVIRONMENT deployment" >> "$GITHUB_STEP_SUMMARY" && echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
