<html lang="es">
<head>

<title>X-Ray · Salud financiera</title>
<meta name="description" content="X-Ray: score de salud financiera de pymes a partir de su tesorería, con previsión, explicación y simulador de escenarios.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d366b'/%3E%3Cpath d='M7 11h18M7 16h12M7 21h15' stroke='%2386b6ef' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
/* ───────────── Tokens ───────────── */
:root {
  color-scheme: light;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  --bg: #f4f4f1;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --surface-3: #eceae4;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6b6a65;
  --line: #e1e0d9;
  --line-strong: #c3c2b7;
  --ring: rgba(11, 11, 11, .10);
  --accent: #1c5cab;
  --accent-ink: #ffffff;
  --accent-soft: #e6effb;
  --brand: #0d366b;
  --shadow: 0 1px 2px rgba(11, 11, 11, .04), 0 2px 8px rgba(11, 11, 11, .04);

  /* dataviz: categorical (validado, modo claro) */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --viz-grid: #e1e0d9;
  --viz-axis: #c3c2b7;
  --viz-muted: #898781;
  --viz-raw: #a9a79f;

  /* status (fijo) */
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --crit: #d03b3b;
  /* texto de delta */
  --good-text: #006300;
  --crit-text: #b3261e;
  /* divergente de contribuciones (verde +, rojo −) */
  --pos: #1f9a3a;
  --neg: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --surface-3: #2a2a28;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #9c9b93;
    --line: #2c2c2a;
    --line-strong: #383835;
    --ring: rgba(255, 255, 255, .10);
    --accent: #6da7ec;
    --accent-ink: #0b0b0b;
    --accent-soft: #16263b;
    --brand: #86b6ef;
    --shadow: none;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --viz-grid: #2c2c2a;
    --viz-axis: #383835;
    --viz-muted: #898781;
    --viz-raw: #6a6963;
    --good-text: #3fc43f;
    --crit-text: #ff8a80;
    --pos: #2fb44a;
    --neg: #e25555;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222220;
  --surface-3: #2a2a28;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #9c9b93;
  --line: #2c2c2a;
  --line-strong: #383835;
  --ring: rgba(255, 255, 255, .10);
  --accent: #6da7ec;
  --accent-ink: #0b0b0b;
  --accent-soft: #16263b;
  --brand: #86b6ef;
  --shadow: none;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --viz-grid: #2c2c2a;
  --viz-axis: #383835;
  --viz-muted: #898781;
  --viz-raw: #6a6963;
  --good-text: #3fc43f;
  --crit-text: #ff8a80;
  --pos: #2fb44a;
  --neg: #e25555;
}

/* ───────────── Base ───────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--font); font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: 22px; line-height: 1.25; }
h2 { font-size: 15px; }
h3 { font-size: 14px; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.icon { width: 1em; height: 1em; flex: none; vertical-align: -.125em; }

/* ───────────── Shell ───────────── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-in { max-width: 1320px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none !important; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: #0d366b; box-shadow: inset 0 0 0 1px var(--ring); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
.brand-sub { font-size: 12px; color: var(--muted); border-left: 1px solid var(--line); padding-left: 10px; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.nav a {
  color: var(--ink-2); padding: 6px 12px; border-radius: 8px; font-weight: 500; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--surface-3); color: var(--ink); }
.nav .count { font-size: 11px; font-weight: 600; background: var(--crit); color: #fff; border-radius: 10px; padding: 0 6px; line-height: 17px; }
.theme-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer;
  color: var(--ink-2); font-size: 12px; display: inline-flex; gap: 6px; align-items: center;
}
.theme-btn:hover { color: var(--ink); border-color: var(--line-strong); }
main { max-width: 1320px; margin: 0 auto; padding: 24px 24px 64px; outline: none; }
footer { max-width: 1320px; margin: 0 auto; padding: 0 24px 32px; color: var(--muted); font-size: 12px; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head p { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card-pad { padding: 18px 20px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head p { color: var(--muted); font-size: 12.5px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.stack { display: grid; gap: 16px; }

/* estados */
.state { padding: 48px 16px; text-align: center; color: var(--muted); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: -4px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { border: 1px solid color-mix(in srgb, var(--crit) 40%, var(--line)); background: color-mix(in srgb, var(--crit) 7%, var(--surface)); border-radius: 12px; padding: 18px 20px; display: grid; gap: 8px; max-width: 720px; }
.error-box strong { display: flex; gap: 8px; align-items: center; }
.error-box code { font-family: var(--mono); font-size: 12px; color: var(--ink-2); word-break: break-word; }

/* botones & chips */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn-sm { padding: 4px 10px; font-size: 12.5px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px;
  font-size: 12px; font-weight: 500; line-height: 20px; white-space: nowrap; color: var(--ink);
  background: var(--surface-3);
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip-band-sano { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.chip-band-vigilar { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); }
.chip-band-riesgo { background: color-mix(in srgb, var(--crit) 15%, var(--surface)); }
.chip-band-sano .icon { color: var(--good); }
.chip-band-vigilar .icon { color: color-mix(in srgb, var(--warn) 70%, #7a5200); }
.chip-band-riesgo .icon { color: var(--crit); }
:root[data-theme="dark"] .chip-band-vigilar .icon { color: var(--warn); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip-band-vigilar .icon { color: var(--warn); } }
.chip-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-2); }
.chip-sev-alta { background: color-mix(in srgb, var(--crit) 15%, var(--surface)); }
.chip-sev-alta .icon { color: var(--crit); }
.chip-sev-media { background: color-mix(in srgb, var(--serious) 18%, var(--surface)); }
.chip-sev-media .icon { color: var(--serious); }
.chip-sev-baja { background: var(--surface-3); }
.chip-sev-baja .icon { color: var(--muted); }
.trend { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.trend-mejora .icon { color: var(--good-text); }
.trend-deterioro .icon { color: var(--crit-text); }
.trend-estable .icon { color: var(--muted); }
.delta-pos { color: var(--good-text); }
.delta-neg { color: var(--crit-text); }
.delta-zero { color: var(--ink-2); }

.seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center;
}
.seg button:hover { border-color: var(--line-strong); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ───────────── Cartera ───────────── */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile {
  text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; display: grid; gap: 2px; box-shadow: var(--shadow); position: relative;
}
.tile:hover { border-color: var(--line-strong); }
.tile[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
/* Eventos */
.tiles-ev { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.chip-ev { font-weight: 600; }
.chip-ev-riesgo { color: var(--crit-text); border-color: color-mix(in srgb, var(--crit) 35%, var(--line)); }
.chip-ev-mejora { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.chip-ev-ruido { color: var(--muted); border-color: var(--line); }
.ev-row.ev-riesgo { border-left: 3px solid var(--crit); }
.ev-row.ev-mejora { border-left: 3px solid var(--good); }
.ev-row.ev-ruido { border-left: 3px solid var(--line-strong); }
.ev-why { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
.ev-excl { font-size: 12.5px; color: var(--ink-2); margin: 4px 0 0; font-style: italic; }
.ev-foot { display: flex; justify-content: center; padding: 12px 0 4px; }
.ev-cat { margin-top: 16px; }
.ev-cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 12px; }
.ev-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--surface); }
.ev-card-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.ev-card p { margin: 0 0 6px; font-size: 13px; line-height: 1.5; }
@media (max-width: 900px) { .tiles-ev { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ev-cat-grid { grid-template-columns: 1fr; } }
.tile-label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.tile-value { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.tile-sub { font-size: 12px; color: var(--muted); }
.tile .bar { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin-top: 8px; }
.tile .bar i { display: block; height: 100%; border-radius: 2px; }

.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.field { display: inline-flex; flex-direction: column; gap: 3px; }
.field > span { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.input, .select {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-height: 36px;
}
.input:hover, .select:hover { border-color: var(--line-strong); }
.search { position: relative; flex: 1 1 220px; max-width: 320px; }
.search .input { width: 100%; padding-left: 32px; }
.search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 36px; align-self: flex-end; }
.check input { accent-color: var(--accent); margin: 0; }
.result-count { margin-left: auto; color: var(--muted); font-size: 12.5px; align-self: flex-end; padding-bottom: 8px; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
td.r, th.r { text-align: right; }
tbody tr:last-child td { border-bottom: none; }
table.data td { font-variant-numeric: tabular-nums; }
th button.sort { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button.sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
th[aria-sort] button.sort { color: var(--ink); }

table.companies tbody tr { cursor: pointer; }
table.companies tbody tr:hover td { background: var(--surface-2); }
.cid { font-weight: 600; font-family: var(--mono); font-size: 13px; color: var(--ink); }
.cmeta { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 1px; flex-wrap: wrap; }
.scorecell { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.scorecell b { font-weight: 600; font-size: 15px; min-width: 36px; text-align: right; }
.meter { width: 64px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--ink-2); }
.range-sub { display: block; font-size: 11.5px; color: var(--muted); }
.alert-cell { max-width: 280px; color: var(--ink-2); font-size: 12.5px; display: flex; gap: 6px; align-items: flex-start; }
.alert-cell .icon { color: var(--serious); margin-top: 3px; }
.alert-cell span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.more { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--line); }

/* ───────────── Detalle ───────────── */
.back { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 13px; margin-bottom: 12px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 32px; align-items: end; }
.hero-id { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.hero-id h1 { font-family: var(--mono); font-size: 22px; letter-spacing: -.02em; }
.hero-meta { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; margin-top: 8px; }
.hero-meta span b { color: var(--ink); font-weight: 500; }
.hero-figs { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
.fig { display: grid; gap: 4px; }
.fig-value { font-size: 20px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.fig-sub { font-size: 12px; color: var(--muted); }
.hero-score { font-size: 56px; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
.hero-score small { font-size: 18px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.conf { display: flex; gap: 8px; align-items: center; }
.conf .meter { width: 72px; }
.conf .meter i { background: var(--accent); }
.banner { margin-top: 16px; display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--serious) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--serious) 35%, var(--line)); }
.banner .icon { color: var(--serious); margin-top: 3px; }

.workbench { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "traj scn" "why scn"; gap: 16px; margin-top: 16px; align-items: start; }
.wb-traj { grid-area: traj; } .wb-scn { grid-area: scn; } .wb-why { grid-area: why; }
.chart-box { position: relative; height: 360px; }
.chart-box.sm { height: 260px; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 10px; }
.legend-item { display: inline-flex; gap: 7px; align-items: center; }
.key { width: 18px; height: 10px; flex: none; position: relative; }
.key.line::after { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; border-radius: 1px; background: var(--c); }
.key.dash::after { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 0; border-top: 2px dashed var(--c); }
.key.band { background: color-mix(in srgb, var(--c) 18%, transparent); border-radius: 2px; }
.key.bar::after { content: ""; position: absolute; left: 4px; top: 0; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.key.dot::after { content: ""; position: absolute; left: 5px; top: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.toggle {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px 3px 8px; cursor: pointer;
  font-size: 12.5px; display: inline-flex; gap: 7px; align-items: center; color: var(--ink);
}
.toggle[aria-pressed="false"] { color: var(--muted); background: transparent; }
.toggle[aria-pressed="false"] .key { opacity: .25; }
.toggle small { color: var(--muted); }
.toggle:disabled { cursor: not-allowed; opacity: .55; }
details.tableview { margin-top: 10px; }
details.tableview summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
details.tableview summary:hover { color: var(--ink); }
details.tableview .table-wrap { max-height: 320px; overflow: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; }
details.tableview th, details.tableview td { padding: 6px 10px; font-size: 12.5px; }

/* Escenarios */
.scn { position: sticky; top: 72px; }
.scn-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.scn-head h2 { display: flex; gap: 8px; align-items: center; }
.scn-head .badge { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 4px; }
.scn-result { margin: 14px 0; padding: 14px; border-radius: 10px; background: var(--surface-2); display: grid; gap: 8px; transition: opacity .15s; }
.scn-result.pending { opacity: .55; }
.scn-result .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.scn-delta { font-size: 34px; font-weight: 650; letter-spacing: -.02em; line-height: 1; }
.scn-bands { display: inline-flex; gap: 6px; align-items: center; }
.scn-sum { font-size: 13px; color: var(--ink-2); }
.presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
.preset {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; cursor: pointer; display: grid; gap: 1px;
}
.preset:hover { border-color: var(--line-strong); background: var(--surface-2); }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.preset b { font-size: 12.5px; font-weight: 600; }
.preset small { font-size: 11.5px; color: var(--muted); }
.sliders { display: grid; gap: 12px; }
.slider { display: grid; gap: 2px; }
.slider-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.slider-top label { font-size: 13px; font-weight: 500; }
.slider-top output { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; min-width: 64px; text-align: right; }
.slider-top output.moved { color: var(--accent); }
.slider small { font-size: 11.5px; color: var(--muted); }
.slider.disabled { opacity: .5; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 4px 0; height: 22px; cursor: pointer; }
.slider.months { padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.scn-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 16px; }
.scn-error { color: var(--crit-text); font-size: 12.5px; }

/* Contribuciones divergentes */
.contribs { display: grid; gap: 4px; }
.contrib { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 4px 0; }
.contrib-label { font-size: 13px; line-height: 1.3; }
.contrib-label small { display: block; color: var(--muted); font-size: 11.5px; }
.div-track { position: relative; height: 22px; }
.div-track::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--viz-axis); }
.div-bar { position: absolute; top: 5px; height: 12px; }
.div-bar.pos { left: 50%; background: var(--pos); border-radius: 0 4px 4px 0; }
.div-bar.neg { right: 50%; background: var(--neg); border-radius: 4px 0 0 4px; }
.contrib-val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.contrib-text { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }
.summary { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 13.5px; margin-bottom: 14px; }
.why-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.alist { display: grid; gap: 0; }
.aitem { display: grid; grid-template-columns: 76px auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.aitem:last-child { border-bottom: none; }
.aitem .when { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.aitem .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.aitem .txt { font-size: 13px; color: var(--ink-2); }

/* Monitor */
.mon-list { display: grid; gap: 10px; }
.mon {
  display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 16px; align-items: center;
  padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; position: relative;
}
.mon::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--line-strong); }
.mon.sev-alta::before { background: var(--crit); }
.mon.sev-media::before { background: var(--serious); }
.mon:hover { border-color: var(--line-strong); }
.mon-main { display: grid; gap: 4px; }
.mon-main .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mon-main .txt { color: var(--ink-2); font-size: 13px; }
.mon-figs { display: flex; gap: 20px; text-align: right; }
.mon-figs .fig-value { font-size: 17px; }

/* Productos financieros */
.prod-kpi-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
.prod-kpi-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 4px; }
.prod-kpi-tile .v { font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
.prod-kpi-tile .k { font-size: 12px; color: var(--ink-2); }
.prod-kpi-tile .d { font-size: 11px; color: var(--muted); }
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); gap: 16px; }
.prod-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 10px; }
.prod-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.prod-header { display: flex; gap: 10px; align-items: flex-start; }
.prod-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.prod-icon svg { width: 22px; height: 22px; }
.prod-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
.prod-desc { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.prod-metrics { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.prod-metric { display: grid; gap: 2px; }
.prod-metric .v { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.prod-metric .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.prod-status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.prod-status-disponible { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good-text); }
.prod-status-recomendado { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: color-mix(in srgb, var(--warn) 60%, #7a5200); }
.prod-status-preventivo { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); }
.prod-status-preventivo-lejano { background: var(--surface-3); color: var(--muted); }
.prod-status-ahorro { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good-text); }
.prod-status-rentable { background: color-mix(in srgb, var(--series-4) 18%, var(--surface)); color: color-mix(in srgb, var(--series-4) 70%, #7a5200); }
.prod-consumer { font-size: 13px; color: var(--ink-2); font-style: italic; border-left: 3px solid var(--accent); padding-left: 10px; margin-top: 4px; }
.prod-score-impact { font-size: 11px; color: var(--muted); }
.prod-link { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; color: var(--accent); font-weight: 500; }

/* Métricas y decisiones */
.metric-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.mtile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.mtile .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.mtile .k { font-size: 12.5px; color: var(--ink-2); }
.mtile .d { font-size: 11.5px; }
table.iters th { white-space: normal; vertical-align: bottom; min-width: 84px; }
tr.final td { background: var(--accent-soft); font-weight: 600; }
tr.final td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tag-final { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; margin-top: 16px; }
figure.gchart { margin: 0; }
figure.gchart h3 { margin-bottom: 10px; }
figure.gchart figcaption { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

.dec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.dec { display: flex; flex-direction: column; gap: 12px; }
.dec-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dec-id { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); }
.status-ok { background: color-mix(in srgb, var(--good) 13%, var(--surface)); }
.status-ok .icon { color: var(--good); }
.status-pending { background: color-mix(in srgb, var(--warn) 24%, var(--surface)); border: 1px dashed color-mix(in srgb, var(--warn) 70%, #7a5200); }
.status-pending .icon { color: color-mix(in srgb, var(--warn) 60%, #7a5200); }
.dec-q { color: var(--ink-2); font-size: 13.5px; font-style: italic; }
.dec dl { margin: 0; display: grid; gap: 10px; }
.dec dt { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.dec dd { margin: 2px 0 0; font-size: 13.5px; }
.dec dd.decision { font-weight: 500; color: var(--ink); }
.dec .gchart { border-top: 1px solid var(--line); padding-top: 12px; }
.filterbar { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }

/* Tesorería */
.tes-picker { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.tes-picker .search { flex: none; width: 200px; }
.tes-picker .btn { min-height: 36px; }
.tes-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tes-kpis .mtile .v { font-size: 22px; }
.tes-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.debt-list { display: grid; gap: 0; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; }
.debt-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: baseline; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.debt-row:last-child { border-bottom: none; }
.debt-row .num { text-align: right; font-weight: 600; }
.debt-row small { color: var(--muted); font-size: 11.5px; text-align: right; min-width: 110px; }
.debt-row.total { background: var(--surface-2); border-radius: 0 0 8px 8px; }
.debt-row.contingent { color: var(--muted); }

/* ───────────── Sala de situaciones ───────────── */
.nav .count-warn { background: var(--serious); }
.sit-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(360px, .9fr); gap: 16px; align-items: start; }
.sit-list { display: grid; gap: 0; }
.sit-row {
  display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 11px 16px;
  border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; background: transparent; border-left: 3px solid transparent; width: 100%;
}
.sit-row:last-child { border-bottom: none; }
.sit-row:hover { background: var(--surface-2); }
.sit-row[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.sit-row.central { border-left-color: var(--ink); }
.sit-row.central[aria-current="true"] { border-left-color: var(--accent); }
.sit-id { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink-2); padding-top: 2px; }
.sit-premisa { font-size: 13px; line-height: 1.4; color: var(--ink); }
.sit-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.sit-meta .chip { font-size: 11px; line-height: 18px; padding: 1px 8px 1px 6px; }
.sit-val { text-align: right; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; display: grid; gap: 2px; justify-items: end; }
.sit-val b { font-variant-numeric: tabular-nums; color: var(--ink); font-size: 13px; }
.light { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
.light::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 18%, transparent); }
.light-pasa { color: var(--good-text); } .light-pasa::before { background: var(--good); }
.light-falla { color: var(--crit-text); } .light-falla::before { background: var(--crit); }
.light-no_verificable { color: var(--muted); } .light-no_verificable::before { background: var(--line-strong); }
.chip-central { background: var(--ink); color: var(--surface); }
.chip-rol { background: var(--surface-3); color: var(--ink-2); }
.sit-detail { position: sticky; top: 72px; display: grid; gap: 14px; }
.sit-detail h2 { font-size: 16px; line-height: 1.35; }
.sit-detail dl { margin: 0; display: grid; gap: 10px; }
.sit-detail dt { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.sit-detail dd { margin: 2px 0 0; font-size: 13.5px; }
.sit-cond { padding: 10px 12px; border-left: 3px solid var(--ink); background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 13.5px; }
.sit-test { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.sit-res { display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
.sit-res .fig-value { font-size: 26px; }
.sit-diag { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; }
.sit-diag b { color: var(--ink); }
.ex-grid { display: grid; gap: 6px; }
.ex-row { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; }
.ex-row .cid { font-size: 12.5px; }
.ex-row .when { color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-row .vals { color: var(--ink-2); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sit-group { margin-top: 20px; }
.sit-group h2 { margin-bottom: 8px; }
.sit-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.sit-tiles .tile-value.crit { color: var(--crit-text); }

/* ───────────── Proactivo ───────────── */
.pro-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; align-items: end; }
.pro-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; align-items: stretch; }
.pro-step { display: flex; flex-direction: column; gap: 12px; position: relative; }
.pro-step .step-n { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.pro-step h2 { font-size: 16px; }
.pro-lines { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pro-line { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.pro-line:last-child { border-bottom: none; }
.pro-line .sgn { font-weight: 700; color: var(--muted); text-align: center; }
.pro-line .sgn.pos { color: var(--good-text); } .pro-line .sgn.neg { color: var(--crit-text); }
.pro-line .lab { display: grid; gap: 1px; }
.pro-line .lab small { color: var(--muted); font-size: 11.5px; }
.pro-line .amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pro-line.total { background: var(--surface-2); font-weight: 600; }
.pro-line.total .amt.neg { color: var(--crit-text); }
.pro-line.head { background: var(--surface-2); }
.pro-path { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.pro-m { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; font-size: 12.5px; }
.pro-m .mo { color: var(--muted); font-size: 11.5px; }
.pro-m .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.pro-m.rotura { border-color: var(--crit); background: color-mix(in srgb, var(--crit) 8%, var(--surface)); }
.pro-m.tension { border-color: color-mix(in srgb, var(--warn) 80%, #7a5200); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
.pro-m.real { border-style: dashed; }
.verdict { padding: 14px; border-radius: 10px; background: var(--surface-2); display: grid; gap: 8px; }
.verdict .big { font-size: 22px; font-weight: 650; letter-spacing: -.01em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip-acc-lend { background: color-mix(in srgb, var(--good) 14%, var(--surface)); } .chip-acc-lend .icon { color: var(--good); }
.chip-acc-watch { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); } .chip-acc-watch .icon { color: color-mix(in srgb, var(--warn) 70%, #7a5200); }
.chip-acc-decline { background: color-mix(in srgb, var(--crit) 15%, var(--surface)); } .chip-acc-decline .icon { color: var(--crit); }
.chip-acc-sin_nota { background: var(--surface-3); color: var(--ink-2); }
.chip-prod { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.razones { display: grid; gap: 8px; }
.razon { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.razon .code { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 4px; text-align: center; padding: 2px 0; height: fit-content; }
.razon b { display: block; }
.razon .val { color: var(--ink-2); font-size: 12.5px; }
.razon p { color: var(--ink-2); margin-top: 2px; }
.outcome-ok { color: var(--good-text); } .outcome-bad { color: var(--crit-text); }
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; margin-bottom: 16px; }
.case { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.case:hover { border-color: var(--line-strong); background: var(--surface-2); }
.case[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.case .top { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.case small { color: var(--muted); font-size: 11.5px; }
.pro-picker { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.pro-picker .search { flex: none; width: 180px; }
.val-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.val-tiles .mtile { padding: 10px 12px; }
.val-tiles .mtile .v { font-size: 20px; }

/* ───────────── Responsive ───────────── */
@media (max-width: 1100px) { .sit-layout { grid-template-columns: minmax(0, 1fr); } .sit-detail { position: static; } .pro-steps { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) { .sit-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pro-head { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .sit-row { grid-template-columns: 50px minmax(0, 1fr); } .sit-val { grid-column: 1 / -1; justify-items: start; } .ex-row { grid-template-columns: auto auto; } .ex-row .vals { grid-column: 1 / -1; white-space: normal; } .pro-path { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1100px) {
  .workbench { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "traj" "scn" "why"; }
  .scn { position: static; }
}
@media (max-width: 1100px) { .tes-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .grid-2, .tes-grid { grid-template-columns: minmax(0, 1fr); }
  .tes-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .topbar-in { padding: 8px 16px; gap: 8px 12px; }
  .brand-sub { display: none; }
  .nav { order: 3; flex-basis: 100%; }
  .nav a { padding: 5px 10px; }
  .theme-btn { margin-left: auto; }
  main { padding: 16px 16px 48px; }
  footer { padding: 0 16px 24px; }
  .card-pad { padding: 14px; }
  .tile-value { font-size: 24px; }
  .search { max-width: none; flex-basis: 100%; }
  .field { flex: 1 1 calc(50% - 10px); }
  .field .select { width: 100%; }
  .result-count { margin-left: 0; }
  .hero-score { font-size: 48px; }
  .hero-figs { gap: 16px 24px; }
  .chart-box { height: 260px; }
  .chart-box.sm { height: 220px; }
  .contrib { grid-template-columns: minmax(0, 1fr) 56px; gap: 2px 10px; }
  .contrib-label { grid-column: 1 / -1; }
  .aitem { grid-template-columns: 70px minmax(0, 1fr); }
  .aitem .txt { grid-column: 1 / -1; }

  const fn = views[view];
  if (!fn) { main.replaceChildren(errorBox({ message: `No existe la sección «${view}».` })); return; }
  try {
    const node = await fn(token);
    if (token !== state.renderToken || !node) return;
    main.replaceChildren(node);
    if (node._after) node._after();
    window.scrollTo(0, 0);
  } catch (e) {
    if (token !== state.renderToken) return;
    console.warn(e);
    main.replaceChildren(errorBox(e, route));
  }
}
const isCurrent = (token) => token === state.renderToken;

    tiles.append(h('button', {
      class: 'tile', type: 'button', 'aria-pressed': String(pressed),
      onclick: () => { if (t.key === 'alert') f.alert = !f.alert; else f.band = f.band === t.key ? '' : t.key; f.limit = 60; route(); },
    },

      h('span', { class: 'tile-value' }, NF[0].format(n)),

  const search = h('input', { class: 'input', type: 'search', placeholder: 'Buscar por empresa o grupo…', value: f.q, 'aria-label': 'Buscar empresa por identificador',
    oninput: (e) => { f.q = e.target.value; f.limit = 60; renderTable(); } });
  const countEl = h('span', { class: 'result-count', 'aria-live': 'polite' });
  const sortSel = h('select', { class: 'select', onchange: (e) => { const [s, d] = e.target.value.split(':'); f.sort = s; f.dir = d; renderTable(); } },
    [['score:desc', 'Score (mayor)'], ['score:asc', 'Score (menor)'], ['delta:asc', 'Δ previsto (peor)'], ['delta:desc', 'Δ previsto (mejor)'], ['confidence:desc', 'Confianza (mayor)'], ['confidence:asc', 'Confianza (menor)']]
      .map(([v, t]) => h('option', { value: v }, t)));
  const bandSel = mkSelect('Banda', 'band', [['', 'Todas'], ['sano', 'Sano'], ['vigilar', 'Vigilar'], ['riesgo', 'Riesgo']]);
  root.append(h('div', { class: 'filters' },
    h('div', { class: 'search' }, icon('search'), search),
    bandSel,
    mkSelect('Tendencia', 'trend', [['', 'Todas'], ['mejora', 'Mejora'], ['estable', 'Estable'], ['deterioro', 'Deterioro']]),
    mkSelect('ERP', 'erp', [['', 'Todas'], ['si', 'Con ERP'], ['no', 'Sin ERP']]),
    h('label', { class: 'field' }, h('span', null, 'Ordenar por'), sortSel),

    countEl));
  sortSel.value = `${f.sort}:${f.dir}`;

  const card = h('div', { class: 'card' });
  root.append(card);

  const sortKey = { score: (c) => c.score, delta: (c) => c.delta3_q50, confidence: (c) => c.confidence };
  function sortHeader(label, key, cls) {
    const active = f.sort === key;
    const th = h('th', { class: cls, scope: 'col', 'aria-sort': active ? (f.dir === 'asc' ? 'ascending' : 'descending') : null },
      h('button', { class: 'sort', type: 'button', onclick: () => {

        sortSel.value = `${f.sort}:${f.dir}`; renderTable();
      } }, label, active ? icon(f.dir === 'asc' ? 'up' : 'down') : null));
    return th;
  }
  function renderTable() {
    const q = f.q.trim().toLowerCase();
    let rows = all.filter((c) =>
      (!q || String(c.company_id).toLowerCase().includes(q) || String(c.group_id || '').toLowerCase().includes(q)) &&
      (!f.band || c.band === f.band) && (!f.trend || c.trend === f.trend) &&
      (!f.erp || (f.erp === 'si' ? c.has_erp : !c.has_erp)) && (!f.alert || !!c.alert));
    const k = sortKey[f.sort] || sortKey.score; const dir = f.dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      const va = k(a), vb = k(b);
      if (!isNum(va) && !isNum(vb)) return 0; if (!isNum(va)) return 1; if (!isNum(vb)) return -1;

      tbody.append(h('tr', { onclick: (e) => { if (!e.target.closest('a')) location.hash = href; } },
        h('td', { class: 'c-id' },

          h('div', { class: 'cmeta' }, c.group_id || '', h('span', { 'aria-hidden': 'true' }, '·'), c.currency || '', h('span', { 'aria-hidden': 'true' }, '·'),
            c.has_erp ? 'Con ERP' : 'Sin ERP', c.dormant ? h('span', { class: 'chip chip-ghost', style: { 'line-height': '16px', 'font-size': '11px' } }, 'Inactiva') : null)),
        h('td', { class: 'c-score r' }, h('div', { class: 'scorecell' },
          h('span', { class: 'meter', 'aria-hidden': 'true' }, h('i', { style: { width: `${Math.max(0, Math.min(100, c.score || 0))}%` } })),
          h('b', { class: 'num' }, fmt(c.score)))),
        h('td', { class: 'c-band' }, bandChip(c.band)),
        h('td', { class: 'c-trend' }, trendEl(c.trend)),
        h('td', { class: 'c-delta r num', 'data-label': 'Δ 3m' },
          h('span', { class: deltaClass(c.delta3_q50, 1), style: { 'font-weight': '600' } }, fmtSigned(c.delta3_q50)),
          h('span', { class: 'range-sub' }, `${fmtSigned(c.delta3_q10)} a ${fmtSigned(c.delta3_q90)}`)),
        h('td', { class: 'c-conf r num', 'data-label': 'Confianza' }, fmtPct(c.confidence)),
        h('td', { class: 'c-alert' }, c.alert ? h('div', { class: 'alert-cell', title: c.alert }, icon('bell'), h('span', null, c.alert)) : null)));
    });
    const table = h('table', { class: 'companies' },
      h('caption', { class: 'visually-hidden' }, 'Empresas de la cartera con su score, banda, tendencia y cambio previsto a 3 meses'),
      h('thead', null, h('tr', null,
        h('th', { scope: 'col' }, 'Empresa'), sortHeader('Score', 'score', 'r'), h('th', { scope: 'col' }, 'Banda'),
        h('th', { scope: 'col' }, 'Tendencia'), sortHeader('Δ previsto 3m', 'delta', 'r'), sortHeader('Confianza', 'confidence', 'r'),
        h('th', { scope: 'col' }, 'Alerta'))),
      tbody);
    const kids = [h('div', { class: 'table-wrap' }, table)];
    if (!rows.length) kids.push(h('div', { class: 'state' }, 'Ninguna empresa cumple los filtros.'));
    if (rows.length > shown.length) kids.push(h('div', { class: 'more' },
      h('button', { class: 'btn', type: 'button', onclick: () => { f.limit += 60; renderTable(); } }, `Mostrar más (quedan ${NF[0].format(rows.length - shown.length)})`)));
    card.replaceChildren(...kids);
  }
  renderTable();
  return root;
}

/* ── Gráfica de trayectoria (base + escenario) */
function trajectoryChart(canvas, legendEl, d, tableHost) {
  const hist = d.history || [], fc = d.forecast || [];
  const labels = [...hist.map((x) => x.month), ...fc.filter((f) => !hist.some((x) => x.month === f.month)).map((f) => f.month)];
  const idx = new Map(labels.map((m, i) => [m, i]));
  const L = labels.length, n = hist.length;
  const arr = () => new Array(L).fill(null);
  const raw = arr(); hist.forEach((x, i) => { raw[i] = isNum(x.score_raw) ? x.score_raw : null; });

  function seriesFrom(src, prefix, color, label, startAt = 0) {
    const hs = arr();
    (src.history || []).forEach((p) => { const i = idx.get(p.month); if (i != null && i >= startAt) hs[i] = p.score; });
    let lastI = -1; for (let i = L - 1; i >= 0; i--) if (hs[i] != null) { lastI = i; break; }
    const lo = arr(), hi = arr(), mid = arr();
    if (lastI >= 0) lo[lastI] = hi[lastI] = mid[lastI] = hs[lastI];
    (src.forecast || []).forEach((f) => { const i = idx.get(f.month); if (i == null) return; lo[i] = f.q10; hi[i] = f.q90; mid[i] = f.q50; });
    const common = { pointRadius: 0, pointHoverRadius: 0, spanGaps: false, tension: 0 };
    return [
      { ...common, label: `${label} q10`, data: lo, borderWidth: 0, fill: false, _role: 'fanlo', order: 20 },
      { ...common, label: `${label} rango`, data: hi, borderWidth: 0, backgroundColor: alpha(color, prefix === 'scn' ? 0.16 : 0.13), fill: '-1', _role: 'fanhi', _name: label, order: 20 },
      { ...common, label, data: hs, borderColor: color, borderWidth: 2, pointHoverRadius: 5, pointHoverBackgroundColor: color, pointHoverBorderColor: cssVar('--surface'), pointHoverBorderWidth: 2, borderCapStyle: 'round', borderJoinStyle: 'round', _role: 'hist', _name: label, order: prefix === 'scn' ? 1 : 2 },
      { ...common, label: `${label} q50`, data: mid, borderColor: color, borderWidth: 2, borderDash: [5, 4], pointHoverRadius: 5, pointHoverBackgroundColor: color, pointHoverBorderColor: cssVar('--surface'), pointHoverBorderWidth: 2, _role: 'q50', _name: label, order: prefix === 'scn' ? 1 : 2 },
    ];
  }
  function build(scn) {
    const [c1, c2] = SERIES();
    const base = scn ? scn.baseline : { history: hist, forecast: fc };
    const ds = [...seriesFrom(base, 'base', c1, scn ? 'Base' : 'Score')];
    if (scn) {
      // la línea del escenario empieza un mes antes del primer mes que difiere de la base
      const bmap = new Map((scn.baseline.history || []).map((p) => [p.month, p.score]));
      let first = (scn.scenario.history || []).findIndex((p) => isNum(p.score) && Math.abs(p.score - (bmap.get(p.month) ?? p.score)) > 0.05);
      let startMonth = first > 0 ? scn.scenario.history[first - 1].month : (first === 0 ? scn.scenario.history[0].month : (scn.scenario.history.slice(-1)[0] || {}).month);
      ds.push(...seriesFrom(scn.scenario, 'scn', c2, 'Escenario', idx.get(startMonth) ?? 0));
    }
    ds.push({ label: 'Score bruto', data: raw, showLine: false, pointRadius: 2.5, pointHoverRadius: 4, pointBackgroundColor: cssVar('--viz-raw'), pointBorderWidth: 0, _role: 'raw', order: 30 });
    return ds;
  }
  function legend(scn) {
    const [c1, c2] = SERIES();
    const items = [[scn ? 'Base' : 'Score', 'line', c1], ['Previsión q50', 'dash', c1], ['Rango q10–q90', 'band', c1]];
    if (scn) items.push(['Escenario', 'line', c2], ['Escenario q50', 'dash', c2], ['Escenario q10–q90', 'band', c2]);
    items.push(['Score bruto (sin suavizar)', 'dot', cssVar('--viz-raw')]);
    legendEl.replaceChildren(...items.map(([t, k, col]) => h('span', { class: 'legend-item' }, h('span', { class: `key ${k}`, style: { '--c': col } }), t)));
  }
  function table(scn) {
    const smap = scn ? new Map([...(scn.scenario.history || []), ...(scn.scenario.forecast || []).map((f) => ({ month: f.month, score: f.q50 }))].map((p) => [p.month, p.score])) : null;
    const rows = hist.map((x) => [fmtMonth(x.month, true), fmt(x.score), fmt(x.score_raw), '', '', ...(scn ? [fmt(smap.get(x.month))] : [])])
      .concat(fc.map((f) => [`${fmtMonth(f.month, true)} (previsión h=${f.h})`, fmt(f.q50), '—', fmt(f.q10), fmt(f.q90), ...(scn ? [fmt(smap.get(f.month))] : [])]));
    tableHost.replaceChildren(tableView('Ver datos en tabla', ['Mes', 'Score / q50', 'Score bruto', 'q10', 'q90', ...(scn ? ['Escenario'] : [])], rows, [1, 2, 3, 4, 5]));
  }
  function yRange(scn) {
    const ys = [...hist.map((x) => x.score), ...hist.map((x) => x.score_raw), ...fc.map((f) => f.q10), ...fc.map((f) => f.q90)];
    if (scn) ys.push(...(scn.scenario.history || []).map((p) => p.score), ...(scn.scenario.forecast || []).flatMap((f) => [f.q10, f.q90]));
    const v = ys.filter(isNum);

    if (hi - lo < 40) { lo = Math.max(0, lo - 20); if (hi - lo < 40) hi = Math.min(100, hi + 20); }
    return [lo, hi];
  }
  const [yMin, yMax] = yRange(null);
  const chart = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: build(null) },
    options: {
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 4, right: 8 } },
      scales: (() => { const s = baseScales({ yMin, yMax }); s.x.ticks.callback = function (v) { return fmtMonth(this.getLabelForValue(v)); }; return s; })(),
      plugins: {
        legend: { display: false },
        xrToday: { index: n - 1, label: 'Previsión →' },
        tooltip: {
          filter: (it) => {
            const r = it.dataset._role;
            if (r === 'fanlo' || it.raw == null) return false;
            if ((r === 'fanhi' || r === 'q50') && it.dataIndex <= n - 1) return false;
            return true;
          },
          itemSort: (a, b) => (a.dataset.order - b.dataset.order) || (a.datasetIndex - b.datasetIndex),
          callbacks: {
            title: (items) => items.length ? fmtMonth(items[0].label, true) + (items[0].dataIndex > n - 1 ? ' · previsión' : '') : '',
            label: (it) => {
              const r = it.dataset._role;
              if (r === 'fanhi') { const lo = it.chart.data.datasets[it.datasetIndex - 1].data[it.dataIndex]; return `${fmt(lo)} – ${fmt(it.raw)}  ${it.dataset._name} q10–q90`; }
              if (r === 'q50') return `${fmt(it.raw)}  ${it.dataset._name} previsión q50`;
              return `${fmt(it.raw)}  ${it.dataset.label}`;
            },
            labelColor: (it) => { const col = it.dataset.borderColor || it.dataset.backgroundColor || it.dataset.pointBackgroundColor; return { borderColor: col, backgroundColor: typeof col === 'string' ? col : cssVar('--series-1') }; },
          },
        },
      },
    },
  });
  state.charts.push(chart);
  legend(null); table(null);
  return {
    setScenario(scn) { const [lo, hi] = yRange(scn); chart.options.scales.y.min = lo; chart.options.scales.y.max = hi; chart.data.datasets = build(scn); chart.update(reducedMotion ? 'none' : undefined); legend(scn); table(scn); },
  };
}

      h('div', { class: 'card-head' }, h('div', null, h('h3', null, 'Qué mueve el escenario'),
        h('p', null, `Contribución de cada palanca al score de ${fmtMonth(c.last_month, true)}, escenario frente a base.`))),
      contributionsEl(r.contributions || [], d.feature_meta || {}, 'El escenario no cambia el score.'),
      h('div', { style: { 'margin-top': '14px' } }, h('h3', { style: { 'margin-bottom': '4px' } }, 'Alertas que dispararía'),
        alertsList(alertsAfter, 'Ninguna alerta nueva en el último mes con este escenario.'))));
  }
  async function run() {
    clearTimeout(timer);
    const moved = Object.fromEntries(Object.keys(defaults).filter(isMoved).map((k) => [k, S.values[k]]));
    errEl.textContent = '';
    if (ctrl) ctrl.abort();
    if (!Object.keys(moved).length) { lastResp = null; traj.setScenario(null); renderIdle(); return; }
    ctrl = new AbortController();
    const my = ctrl;
    resultEl.classList.add('pending');
    try {
      const r = await api('/api/scenario', { method: 'POST', body: JSON.stringify({ company_id: c.company_id, months: S.months, drivers: moved }), signal: my.signal });
      if (my.signal.aborted || !document.body.contains(panel)) return;
      if (!r || !r.baseline || !r.scenario) throw new Error('Respuesta del escenario incompleta.');
      lastResp = r; traj.setScenario(r); renderResult(r);
    } catch (e) {
      if (e.name === 'AbortError') return;
      console.warn(e);
      resultEl.classList.remove('pending');
      errEl.textContent = `No se pudo calcular el escenario: ${e.message}`;
    }
  }
  syncOutputs(); markPresets();
  if (Object.keys(defaults).some(isMoved)) run(); else renderIdle();
}

function fmtMoneyFull(x, cur = 'EUR') {
  if (!isNum(x)) return '—';
  try { return new Intl.NumberFormat('es-ES', { style: 'currency', currency: cur || 'EUR', maximumFractionDigits: 0 }).format(x).replace('-', '−'); }
  catch { return fmt(x, 0) + ' ' + (cur || ''); }
}
const tBar = (label, data, color, fillColor = color) => ({
  type: 'bar', label, data, backgroundColor: fillColor, hoverBackgroundColor: alpha(color, 0.8), borderRadius: 3, borderWidth: 0,
  maxBarThickness: 18, categoryPercentage: 0.75, barPercentage: 0.9, _color: color, order: 2,
});
const tLine = (label, data, color, { dash = false, fill = false } = {}) => ({
  type: 'line', label, data, borderColor: color, backgroundColor: fill ? alpha(color, 0.12) : color, fill: fill ? 'origin' : false,
  borderWidth: 2, borderDash: dash ? [5, 4] : [], pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: color,
  pointHoverBorderColor: cssVar('--surface'), pointHoverBorderWidth: 2, tension: 0, spanGaps: false, _color: color, order: 1,
});
function moneyChart(canvas, labels, datasets, cur, { stacked = false } = {}) {
  const s = baseScales();
  s.x.ticks.callback = function (v) { return fmtMonth(this.getLabelForValue(v)); };
  s.y.ticks.callback = (v) => fmtMoney(v, cur);
  if (stacked) { s.x.stacked = true; s.y.stacked = true; }
  const chart = new Chart(canvas, {
    type: 'bar', data: { labels, datasets },
    options: {
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 4, right: 8 } },
      scales: s,
      plugins: { legend: { display: false }, tooltip: {
        filter: (it) => isNum(it.raw),
        callbacks: {
          title: (items) => items.length ? fmtMonth(items[0].label, true) : '',
          label: (it) => `${fmtMoneyFull(it.raw, cur)}  ${it.dataset.label}`,
          labelColor: (it) => ({ borderColor: it.dataset._color, backgroundColor: it.dataset._color }),
        } } },
    },
  });
  state.charts.push(chart);
  return chart;
}
function tesCard(id, title, desc) {
  const legend = h('div', { class: 'legend', 'aria-hidden': 'true' });
  const canvas = h('canvas', { role: 'img', 'aria-label': title });
  const top = h('div');
  const bottom = h('div');
  const box = h('div', { class: 'chart-box sm' }, canvas);
  const card = h('section', { class: 'card card-pad', 'aria-labelledby': id },
    h('div', { class: 'card-head' }, h('div', null, h('h2', { id }, title), h('p', null, desc))), top, legend, box, bottom);
  return { card, canvas, legend, top, bottom, box };
}
function setLegend(el, items) {
  el.replaceChildren(...items.map(([t, k, col]) => h('span', { class: 'legend-item' }, h('span', { class: `key ${k}`, style: { '--c': col } }), t)));
}

/* Severidades con los tokens de estado, nunca con el violeta de marca: riesgo=--crit,
   mejora=--good, ruido=--muted. El color dice qué tipo de señal es, no cuánto vale. */
const EV_SEV = {
  riesgo: { label: 'Riesgo', color: 'var(--crit)', icon: 'alert' },
  mejora: { label: 'Mejora', color: 'var(--good)', icon: 'up' },
  ruido: { label: 'Ruido', color: 'var(--muted)', icon: 'flat' },
};
/* Una tasa del 0,11 % no puede quedarse en «0 %»: por debajo del 1 % se muestra con decimal. */
const fmtRate = (t) => (t >= 1 ? `${NF[0].format(Math.round(t))} %` : `${t.toFixed(2).replace('.', ',')} %`);
function evSevChip(sev) {
  const m = EV_SEV[sev] || EV_SEV.ruido;
  return h('span', { class: `chip chip-ev chip-ev-${sev}` }, icon(m.icon), m.label);
}

/* Chips de eventos activos en la ficha de empresa: un chip por tipo, con su conteo. */
function eventChips(evs) {
  if (!evs || !evs.total) return [];
  const byType = Object.fromEntries((evs.catalog || []).map((c) => [c.type, c]));

}

/* ═════════════ Charts genéricos (métricas y decisiones) */
function genericChart(spec, compact = false) {
  const fig = h('figure', { class: 'gchart' });
  if (!spec || !Array.isArray(spec.datasets)) return fig;
  const canvas = h('canvas', { role: 'img', 'aria-label': spec.title || 'Gráfica' });
  fig.append(h('h3', null, spec.title || ''), h('div', { class: `chart-box ${compact ? 'sm' : ''}`, style: compact ? { height: '220px' } : { height: '280px' } }, canvas));
  if (spec.note) fig.append(h('figcaption', null, spec.note));
  const colors = SERIES().concat([cssVar('--viz-muted')]);
  const type = ['bar', 'line', 'scatter'].includes(spec.type) ? spec.type : 'bar';
  const multi = spec.datasets.length > 1;
  const surface = cssVar('--surface');
  const datasets = spec.datasets.slice(0, 5).map((ds, i) => {
    const col = colors[i];
    const baseDs = { label: ds.label || `Serie ${i + 1}`, data: ds.data || [] };
    if (type === 'bar') return { ...baseDs, backgroundColor: col, hoverBackgroundColor: alpha(col, 0.8), borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'start', maxBarThickness: 24, categoryPercentage: 0.7, barPercentage: 0.9, borderWidth: 0 };
    if (type === 'line') {
      const few = (ds.data || []).length <= 12;
      return { ...baseDs, borderColor: col, backgroundColor: col, borderWidth: 2, tension: 0, pointRadius: few ? 4 : 0, pointBorderColor: surface, pointBorderWidth: 2, pointHoverRadius: 5, pointHitRadius: 12 };
    }
    return { ...baseDs, backgroundColor: alpha(col, 0.85), borderColor: surface, borderWidth: 1.5, pointRadius: 4.5, pointHoverRadius: 6, pointHitRadius: 12 };
  });
  const scales = baseScales({ xType: type === 'scatter' ? 'linear' : 'category', xTitle: spec.x_label, yTitle: spec.y_label });
  if (type === 'bar') scales.y.beginAtZero = true;
  if (type === 'scatter') { scales.x.ticks.callback = (v) => fmtTick(v); scales.x.ticks.maxTicksLimit = 7; scales.x.grid.display = true; scales.x.grace = '6%'; scales.y.grace = '6%'; }
  const chart = new Chart(canvas, {
    type, data: { labels: type === 'scatter' ? undefined : spec.labels, datasets },
    options: {
      interaction: type === 'scatter' ? { mode: 'nearest', intersect: false } : { mode: 'index', intersect: false },
      plugins: {
        legend: { display: multi, position: 'top', align: 'start', labels: { boxWidth: type === 'line' ? 16 : 10, boxHeight: type === 'line' ? 2 : 10, useBorderRadius: true, borderRadius: 2, padding: 12, color: cssVar('--ink-2') } },
        tooltip: { callbacks: {
          label: (it) => type === 'scatter' ? `${fmtMetric(it.raw.x)} · ${fmtMetric(it.raw.y)}  ${it.dataset.label}` : `${fmtMetric(it.raw)}  ${it.dataset.label}`,
          labelColor: (it) => ({ borderColor: colors[it.datasetIndex], backgroundColor: colors[it.datasetIndex] }),
        } },
      },
      scales,
    },
  });
  state.charts.push(chart);
  // tabla gemela
  let headers, rows;
  if (type === 'scatter') {
    headers = ['Serie', spec.x_label || 'x', spec.y_label || 'y'];
    rows = spec.datasets.flatMap((ds) => (ds.data || []).map((p) => [ds.label || '', fmtMetric(p.x), fmtMetric(p.y)]));
  } else {
    headers = [spec.x_label || '', ...spec.datasets.map((ds) => ds.label || '')];
    rows = (spec.labels || []).map((l, i) => [l, ...spec.datasets.map((ds) => fmtMetric((ds.data || [])[i]))]);
  }
  fig.append(tableView('Ver datos en tabla', headers, rows, headers.map((_, i) => i).slice(1)));
  return fig;
}

      h('p', null, 'Caja real reconstruida del banco frente a la proyectada. La recomendación se hizo sin ver estos meses.')),
      h('span', { class: `chip ${hit ? 'chip-band-sano' : 'chip-band-riesgo'}` }, icon(hit ? 'check' : 'x'), hit ? (predT ? 'Anticipado: la tensión llegó' : 'Correcto: sin tensión') : (predT ? 'Falsa alarma: no hubo tensión' : 'No detectado: hubo tensión'))));
    outCard.append(h('div', { class: 'pro-path' }, (out.meses || []).map((mm, i) => {
      const pr = (p.meses || [])[i];
      return h('div', { class: `pro-m real ${mm.rotura ? 'rotura' : mm.tension ? 'tension' : ''}` },
        h('span', { class: 'mo' }, `T+${i + 1} · ${fmtMonth(mm.month)} · real`), h('span', { class: 'v' }, fm(mm.caja_real)),
        h('span', { class: 'muted', style: { 'font-size': '11px' } }, `${mm.rotura ? 'en negativo' : mm.tension ? 'tensión' : 'sin tensión'}${pr ? ` · proyectado ${fm(pr.caja)}` : ''}${isNum(mm.score) ? ` · score ${fmt(mm.score)}` : ''}`));
    })));
    outCard.append(tableView('Ver flujos reales', ['Mes', 'Cobros reales', 'Pagos reales', 'Nóminas', 'Cuotas', 'Caja real', 'Caja proyectada'],
      (out.meses || []).map((mm, i) => [fmtMonth(mm.month, true), fm(mm.cobros_reales), fm(mm.pagos_reales), fm(mm.nominas_reales), fm(mm.cuotas_reales), fm(mm.caja_real), fm(((p.meses || [])[i] || {}).caja)]), [1, 2, 3, 4, 5, 6]));
  } else {
    outCard.append(h('div', { class: 'card-head' }, h('div', null, h('h2', null, 'Desenlace real'), h('p', null, out.motivo || 'T+2 aún no está en el panel: esta recomendación es la que se daría hoy.'))));
  }
  root.append(outCard);
  return root;
}

/* ═════════════ Tema ═════════════ */
const THEMES = ['auto', 'light', 'dark'];
const THEME_LABEL = { auto: 'Automático', light: 'Claro', dark: 'Oscuro' };
let theme = 'auto';
try { theme = localStorage.getItem('xray-theme') || 'auto'; } catch { /* sin almacenamiento */ }
function applyTheme() {
  if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  const btn = $('#theme-btn');
  btn.replaceChildren(icon(theme === 'dark' ? 'moon' : theme === 'light' ? 'sun' : 'auto'), THEME_LABEL[theme]);
  btn.setAttribute('aria-label', `Tema: ${THEME_LABEL[theme]}. Pulsa para cambiar.`);
  applyChartTheme();
}
$('#theme-btn').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem('xray-theme', theme); } catch { /* ignorar */ }
  applyTheme(); route();
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (theme === 'auto') { applyChartTheme(); route(); } });

/* ═════════════ Arranque ═════════════ */
function boot() {
  applyTheme();
  if (!window.Chart) {
    main.replaceChildren(errorBox({ message: 'No se pudo cargar Chart.js desde el CDN. Revisa la conexión a internet.', detail: 'https://cdn.jsdelivr.net/npm/chart.js' }, () => location.reload()));
    return;
  }
  registerPlugins();
  window.addEventListener('hashchange', route);
  if (!location.hash) history.replaceState(null, '', '#/cartera');
  route();
  getMonitor().then((m) => {
    const n = (m.alerts || []).filter((a) => a.severity === 'alta').length;
    const el = $('#nav-alerts'); if (n) { el.textContent = String(n); el.hidden = false; el.setAttribute('aria-label', `${n} alertas de severidad alta`); }
  }).catch(() => { /* el monitor mostrará el error */ });
  getSituaciones().then((s) => {
    const n = (s.resumen || {}).centrales_fallan || 0;
    const el = $('#nav-sit'); if (n) { el.textContent = String(n); el.hidden = false; el.setAttribute('aria-label', `${n} situaciones centrales que fallan`); }
  }).catch(() => { /* la pestaña mostrará el error */ });
}
boot();
</script>
